<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Makor - Générateur</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app-container">
        <div class="avatar-container">
            <object id="layer-tete" data="images/tete.svg" type="image/svg+xml" class="avatar-layer"></object>
            <object id="layer-cou" data="images/cou.svg" type="image/svg+xml" class="avatar-layer"></object>
            <object id="layer-ombres" data="images/ombres.svg" type="image/svg+xml" class="avatar-layer"></object>
            <object id="layer-cheveux" data="images/cheveux.svg" type="image/svg+xml" class="avatar-layer"></object>
            <object id="layer-sourcils" data="images/sourcils-01.svg" type="image/svg+xml"
                class="avatar-layer"></object>
            <object id="layer-yeux" data="images/yeux-01.svg" type="image/svg+xml" class="avatar-layer"></object>
            <object id="layer-nez" data="images/nez.svg" type="image/svg+xml" class="avatar-layer"></object>
            <object id="layer-bouche" data="images/bouche.svg" type="image/svg+xml" class="avatar-layer"></object>
            <object id="layer-menton" data="images/menton.svg" type="image/svg+xml" class="avatar-layer"></object>
            <object id="layer-oreilles" data="images/oreilles.svg" type="image/svg+xml" class="avatar-layer"></object>
        </div>

        <div class="controls-container">
            <h2>Personnalisation</h2>

            <!-- Navigation par onglets -->
            <div class="tabs-nav">
                <button type="button" class="tab-btn active" data-tab="tab-peau">Peau</button>
                <button type="button" class="tab-btn" data-tab="tab-yeux">Yeux</button>
                <button type="button" class="tab-btn" data-tab="tab-sourcils">Sourcils</button>
                <button type="button" class="tab-btn" data-tab="tab-cheveux">Cheveux</button>
                <button type="button" class="tab-btn" data-tab="tab-ombres">Ombres</button>
            </div>

            <!-- Contenu des onglets -->
            <div class="tab-content active" id="tab-peau">
                <div class="control-group">
                    <label for="skin-color">Couleur de peau :</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="color" id="skin-color" value="#e3c1b3">
                        <button type="button" class="btn-copier">Copier</button>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="tab-yeux">
                <div class="control-group">
                    <label for="eyes-color">Couleur des yeux :</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="color" id="eyes-color" value="#00bfff">
                        <button type="button" class="btn-copier">Copier</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>Modèle des yeux :</label>
                    <div class="model-selector">
                        <label class="model-option">
                            <input type="radio" name="eyes-model" value="images/yeux-01.svg" checked>
                            <span>Style 01</span>
                        </label>
                        <label class="model-option">
                            <input type="radio" name="eyes-model" value="images/yeux-02.svg">
                            <span>Style 02</span>
                        </label>
                        <label class="model-option">
                            <input type="radio" name="eyes-model" value="images/yeux-03.svg">
                            <span>Style 03</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="tab-sourcils">
                <div class="control-group">
                    <label for="eyebrows-color">Couleur des sourcils :</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="color" id="eyebrows-color" value="#333333">
                        <button type="button" class="btn-copier">Copier</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>Modèle de sourcils :</label>
                    <div class="radio-options model-selector">
                        <label class="model-option">
                            <input type="radio" name="eyebrows-model" value="images/sourcils-01.svg" checked>
                            <span>Style 01</span>
                        </label>
                        <label class="model-option">
                            <input type="radio" name="eyebrows-model" value="images/sourcils-02.svg">
                            <span>Style 02</span>
                        </label>
                        <label class="model-option">
                            <input type="radio" name="eyebrows-model" value="images/sourcils-03.svg">
                            <span>Style 03</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="tab-cheveux">
                <div class="control-group">
                    <label for="hair-top-color">Couleur de cheveux (haut) :</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="color" id="hair-top-color" value="#3b2219">
                        <button type="button" class="btn-copier">Copier</button>
                    </div>
                </div>

                <div class="control-group">
                    <label for="hair-sides-color">Couleur de cheveux (côtés / bas) :</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="color" id="hair-sides-color" value="#cccccc">
                        <button type="button" class="btn-copier">Copier</button>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="tab-ombres">
                <div class="control-group">
                    <label for="shadow-opacity-range">Intensité et couleur des ombres :</label>
                    <div class="inline-controls" style="display: flex; gap: 10px; align-items: center;">
                        <input type="range" id="shadow-opacity-range" min="0" max="1" step="0.05" value="0.25"
                            style="flex: 1;">
                        <input type="color" id="shadow-color" value="#000000">
                        <button type="button" class="btn-copier">Copier</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
