<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Makor - Générateur</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app-container">
        <div class="avatar-container">
            <object id="persona-homme" data="images/IDENTITE-PERSONA-HOMME.svg" type="image/svg+xml"
                class="avatar-layer persona-svg active"></object>
            <object id="persona-femme" data="images/IDENTITE-PERSONA-FEMME.svg" type="image/svg+xml"
                class="avatar-layer persona-svg" style="display:none;"></object>
            <object id="persona-garcon" data="images/IDENTITE-PERSONA-GARCON.svg" type="image/svg+xml"
                class="avatar-layer persona-svg" style="display:none;"></object>
            <object id="persona-fille" data="images/IDENTITE-PERSONA-FILLE.svg" type="image/svg+xml"
                class="avatar-layer persona-svg" style="display:none;"></object>
        </div>

        <div class="controls-container">
            <h2>Personnalisation</h2>

            <div class="tabs-nav">
                <button type="button" class="tab-btn active" data-tab="tab-peau">Personnage</button>
                <button type="button" class="tab-btn" data-tab="tab-cheveux">Cheveux</button>
                <button type="button" class="tab-btn" data-tab="tab-vetements">Vêtements</button>
                <button type="button" class="tab-btn" data-tab="tab-export">Export</button>
            </div>

            <div class="tab-content active" id="tab-peau">
                <div class="control-group">
                    <label>Modèle de personnage :</label>
                    <div class="model-selector" style="flex-direction: column; gap: 8px;">
                        <label class="model-option">
                            <input type="radio" name="persona-model" value="persona-homme" checked>
                            <span>Homme</span>
                        </label>
                        <label class="model-option">
                            <input type="radio" name="persona-model" value="persona-femme">
                            <span>Femme</span>
                        </label>
                        <label class="model-option">
                            <input type="radio" name="persona-model" value="persona-garcon">
                            <span>Garçon</span>
                        </label>
                        <label class="model-option">
                            <input type="radio" name="persona-model" value="persona-fille">
                            <span>Fille</span>
                        </label>
                    </div>
                </div>

                <div class="control-group">
                    <label for="chaire-color">Couleur de chaire :</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="color" id="chaire-color" value="#f9cfe3">
                        <button type="button" class="btn-copier">Copier</button>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="tab-cheveux">
                <div class="control-group">
                    <label for="hair-color">Couleur de cheveux :</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="color" id="hair-color" value="#1d1d1b">
                        <button type="button" class="btn-copier">Copier</button>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="tab-vetements">
                <div class="control-group">
                    <label for="clothes-color">Couleur du vêtement :</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="color" id="clothes-color" value="#7c7a2a">
                        <button type="button" class="btn-copier">Copier</button>
                    </div>
                </div>
                <div class="control-group">
                    <label for="collar-color">Couleur du col (enfants) :</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="color" id="collar-color" value="#bcb342">
                        <button type="button" class="btn-copier">Copier</button>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="tab-export">
                <div class="control-group">
                    <label>Téléchargement vectoriel :</label>
                    <button type="button" id="btn-export-svg"
                        style="padding: 10px; cursor: pointer; width: 100%;">Télécharger l'avatar (SVG)</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js?v=18"></script>
</body>

</html>
